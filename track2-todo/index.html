<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 목록 (Todo List)</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1>📝 할 일 목록</h1>
      <p class="subtitle">오늘 해야 할 일을 관리하세요</p>
    </header>

    <form id="todo-form" class="todo-form">
      <input
        type="text"
        id="todo-input"
        class="todo-input"
        placeholder="할 일을 입력하세요..."
        maxlength="200"
        autocomplete="off"
        required
      />
      <input
        type="date"
        id="due-date-input"
        class="date-input"
        title="마감일"
      />
      <button type="submit" class="btn btn-primary">추가</button>
    </form>

    <div class="controls">
      <div class="filters" role="group" aria-label="필터">
        <button class="filter-btn active" data-filter="all">전체</button>
        <button class="filter-btn" data-filter="pending">미완료</button>
        <button class="filter-btn" data-filter="completed">완료</button>
      </div>
      <div class="sort-controls">
        <label for="sort-select" class="visually-hidden">정렬</label>
        <select id="sort-select" class="sort-select">
          <option value="newest">최신순</option>
          <option value="oldest">오래된 순</option>
          <option value="name">이름순</option>
          <option value="duedate">마감일순</option>
        </select>
      </div>
    </div>

    <div class="stats-bar">
      <span class="stat"><strong id="total-count">0</strong> 전체</span>
      <span class="stat pending-stat"><strong id="pending-count">0</strong> 미완료</span>
      <span class="stat completed-stat"><strong id="completed-count">0</strong> 완료</span>
      <button id="clear-completed-btn" class="btn btn-sm btn-danger" style="display:none;">완료 항목 삭제</button>
    </div>

    <ul id="todo-list" class="todo-list" aria-label="할 일 목록">
    </ul>

    <div id="empty-state" class="empty-state" style="display:none;">
      <div class="empty-icon">🗒️</div>
      <p id="empty-message">등록된 할 일이 없습니다.</p>
    </div>
  </div>

  <!-- 수정 모달 -->
  <div id="edit-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" style="display:none;">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <h2 id="modal-title">할 일 수정</h2>
      <input type="text" id="edit-input" class="todo-input" maxlength="200">
      <input type="date" id="edit-due-date" class="date-input" title="마감일">
      <div class="modal-buttons">
        <button id="save-edit-btn" class="btn btn-primary">저장</button>
        <button id="cancel-edit-btn" class="btn btn-secondary">취소</button>
      </div>
    </div>
  </div>

  <script src="js/todo.js"></script>
</body>
</html>
